name: Build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Independent hash and platform tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Core checks
        run: make check
      - name: Address and undefined-behavior sanitizers
        run: make check-sanitize
  native:
    name: Native GTK build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config meson ninja-build gettext libgtk-4-dev libadwaita-1-dev libsoup-3.0-dev libjson-glib-dev libhivex-dev xorriso
      - name: Build and run Meson suites
        run: make
