name: Build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Independent hash and platform tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Core checks
        run: make check
      - name: Address and undefined-behavior sanitizers
        run: make check-sanitize
  native:
    name: Native GTK build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config meson ninja-build gettext libgtk-4-dev libadwaita-1-dev libsoup-3.0-dev libjson-glib-dev libhivex-dev xorriso gzip xz-utils bzip2 zstd qemu-utils xvfb python3-pil dbus-x11
      - name: Build and run Meson suites
        run: make
      - name: Helper corruption and cancellation sanitizers
        run: make check-helper-sanitize
      - name: Non-destructive graphical matrix (4 languages x 3 resolutions)
        run: |
          for language in pt_BR en zh_CN es; do
            for resolution in 1024x768 1280x800 1366x768; do
              export TUXFLASH_SMOKE_LANGUAGE="$language" TUXFLASH_SMOKE_SCREEN="$resolution"
              out="$RUNNER_TEMP/tuxflash-gui-${language}-${resolution}"
              python3 tools/linux/smoke_gui.py "$PWD" "$(command -v Xvfb)" "$out"
              cat "$out/gui.json"
            done
          done
